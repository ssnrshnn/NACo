{% extends "base.html" %}
{% block content %}
<h1>Welcome</h1>
<p class="lead">Accept the terms to get online for {{ hours }} hours.</p>
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/portal/register" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Name <span class="opt">(optional)</span>
    <input type="text" name="full_name" maxlength="128" autocomplete="name">
  </label>
  <label>Email <span class="opt">(optional)</span>
    <input type="email" name="email" maxlength="128" autocomplete="email">
  </label>
  {% if needs_code %}
  <label>Access code
    <input type="text" name="code" required autocomplete="off" autocapitalize="off" spellcheck="false">
  </label>
  {% endif %}
  <details class="terms" open><summary>Terms of use</summary><p>{{ terms }}</p></details>
  <label class="check"><input type="checkbox" name="accept" value="yes" required> I accept the terms of use</label>
  <button type="submit">Connect</button>
</form>
{% endblock %}
