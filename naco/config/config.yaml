# NACo — main configuration file
# Copy this to /etc/naco/config.yaml (or bind-mount via Docker) before launch.

server:
  name: "naco-01"
  host: "0.0.0.0"
  port: 8080
  # Generate strong, *independent* random values for every secret. Each one
  # signs a different artefact, so a single compromise does not invalidate
  # the others. Generate with:  python -c 'import secrets;print(secrets.token_hex(32))'
  session_secret: "CHANGE_ME_session_secret_32_bytes_hex"
  api_secret:     "CHANGE_ME_api_secret_32_bytes_hex"
  csrf_secret:    "CHANGE_ME_csrf_secret_32_bytes_hex"
  admin_username: "admin"
  admin_password: "CHANGE_ME_initial_admin_password"
  token_expire_minutes: 60
  # CIDR ranges that may set the X-Forwarded-For header (e.g. your reverse
  # proxy). Anything outside this list will be ignored for rate-limiting
  # and audit-log IP extraction.
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
    - "172.16.0.0/12"
  debug: false
  log_level: "INFO"
  log_file: "/var/log/naco/naco.log"

database:
  # Default points at the docker-compose `postgres` service. For local dev
  # without docker, set to `sqlite+aiosqlite:///./naco-dev.db`.
  url: "postgresql+asyncpg://naco:naco@postgres:5432/naco"

cache:
  url: "redis://redis:6379/0"

# ── RADIUS ────────────────────────────────────────────────────────────────────
radius:
  enabled: true
  host: "0.0.0.0"
  auth_port: 1812
  acct_port: 1813
  coa_port: 3799
  # When true, every Access-Request must carry a valid Message-Authenticator
  # attribute (RFC 3579 + BlastRADIUS mitigation, CVE-2024-3596).
  require_message_authenticator: true
  clients:
    - name: "core-switch"
      address: "192.168.1.1"
      secret: "CHANGE_ME_radius_secret_for_core_switch"
      require_message_authenticator: true
  default_vlan: 10
  guest_vlan: 20
  reject_vlan: 99

# ── TACACS+ ───────────────────────────────────────────────────────────────────
tacacs:
  enabled: true
  host: "0.0.0.0"
  port: 49
  key: "CHANGE_ME_tacacs_default_key"
  clients:
    - address: "192.168.1.1"
      key: "CHANGE_ME_tacacs_secret_for_core_switch"

# ── Captive / Guest Portal ────────────────────────────────────────────────────
portal:
  enabled: true
  redirect_url: "http://example.com"
  session_hours: 8
  guest_ssid: "NACo-Guest"
  guest_psk: "CHANGE_ME_guest_wifi_password"

# ── Device Profiler ───────────────────────────────────────────────────────────
profiler:
  enabled: true
  listen_interface: "eth0"
  oui_db: "/var/lib/naco/oui.csv"

# ── EAP / FreeRADIUS bridge (optional sidecar container) ─────────────────────
eap:
  enabled: false
  # Pre-shared bearer token presented by FreeRADIUS' rlm_rest module when
  # it calls /api/v1/eap/{auth,authorize,accounting}. Treat it like a
  # service-account password.
  bearer_token: ""

# ── Log Forwarding ────────────────────────────────────────────────────────────
log_forwarding:
  syslog:
    enabled: false
    address: "/dev/log"
    facility: "local0"
    protocol: "udp"
    port: 514

  graylog:
    enabled: false
    host: "192.168.1.100"
    port: 12201
    protocol: "udp"

  webhook:
    enabled: false
    url: ""
    level: "WARNING"
    timeout_seconds: 3.0
    batch_size: 10
    batch_interval_seconds: 5.0
    headers: {}

# ── LDAP / Active Directory ──────────────────────────────────────────────────
ldap:
  enabled: false
  server: "ldap://dc.example.com"
  port: 389
  use_ssl: false
  bind_dn: ""
  bind_password: ""
  base_dn: ""
  user_filter: "(sAMAccountName={username})"
  group_attribute: "memberOf"
  group_map: {}
