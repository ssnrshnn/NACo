<!-- Shared pagination footer for the unified logs page -->
<div class="card-footer d-flex justify-content-between align-items-center">
  <a href="/logs?tab={{ tab }}&page={{ page - 1 }}{% if filter_result %}&result={{ filter_result }}{% endif %}"
     class="btn btn-sm btn-outline-secondary {% if page <= 1 %}disabled{% endif %}">
    <i class="bi bi-chevron-left"></i> Previous
  </a>
  <small class="text-muted">Page {{ page }} of {{ total_pages }}</small>
  <a href="/logs?tab={{ tab }}&page={{ page + 1 }}{% if filter_result %}&result={{ filter_result }}{% endif %}"
     class="btn btn-sm btn-outline-secondary {% if logs|length < per_page %}disabled{% endif %}">
    Next <i class="bi bi-chevron-right"></i>
  </a>
</div>
