<!doctype html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Sign in · {{ server_name }}</title>
</head>
<body data-page="login">
<main class="auth">
  <form class="panel auth-card" id="login-form" data-next="{{ next }}" novalidate>
    <div class="brand"><img src="/static/img/emblem-192.png" alt="" width="44" height="44"><b>NACo</b></div>
    <h1>Sign in</h1>
    <p class="lead">{{ server_name }}</p>
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" autocomplete="username" autocapitalize="off" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="totp_code">Authentication code</label>
      <input class="form-control mono" id="totp_code" name="totp_code" inputmode="numeric" autocomplete="one-time-code"
             placeholder="6-digit code or recovery code" maxlength="16">
      <div class="form-text">Leave empty if two-factor authentication is not set up yet.</div>
    </div>
    <p class="text-danger small hidden" id="login-error" role="alert"></p>
    <button class="btn btn-accent w-100 py-2" type="submit">Sign in</button>
  </form>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
