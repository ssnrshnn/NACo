# NACo settings. No secrets here — those live in .env.
# Every key is validated at start-up; a typo stops NACo with a clear message.
# Defaults are shown; uncomment what you want to change, then:
#   docker compose restart naco

server:
  name: NACo                 # shown in the panel and on the sign-in page
  # Time zone for the panel and for "time" policy conditions.
  timezone: UTC
  log_level: INFO
  log_format: text           # or json

security:
  require_totp: true         # administrators must use two-factor authentication
  session_idle_minutes: 30
  session_max_hours: 12

tacacs:
  enabled: true              # TACACS+ on host port 49

portal:
  enabled: true
  organization: NACo
  session_hours: 8
  # access_code: ""          # optional code guests must enter (6+ characters)
  # terms: |
  #   By using this network you agree to …

# ldap:
#   enabled: true
#   servers: ["ldaps://dc1.example.com", "ldaps://dc2.example.com"]
#   # ca_file: /etc/naco/ad-ca.pem    # put the AD CA in config/ad-ca.pem
#   bind_dn: "CN=naco-svc,OU=Service,DC=example,DC=com"   # password: NACO_LDAP_BIND_PASSWORD
#   base_dn: "DC=example,DC=com"
#   user_filter: "(sAMAccountName={username})"
#   nested_groups: true
#   group_map:                        # first match wins
#     - { ldap_group: "CN=Network Admins,OU=Groups,DC=example,DC=com", group: netadmins }
#     - { ldap_group: "CN=Staff,OU=Groups,DC=example,DC=com", group: staff }

# syslog:
#   enabled: true
#   host: siem.example.com
#   port: 514
#   protocol: udp

retention:
  auth_log_days: 90
  tacacs_log_days: 90
  audit_log_days: 365
