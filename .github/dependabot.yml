# Pinned action SHAs and base images get update pull requests every week.
# Python dependencies are locked in requirements.lock (uv pip compile …);
# refresh them deliberately and let CI's pip-audit flag known issues.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/deploy, /deploy/freeradius]
    schedule: { interval: weekly }
