# Every push to main and every pull request; release.yml runs it again
# before publishing a tag. Actions are pinned to commit SHAs (Dependabot
# keeps them current) and every job gets a read-only token.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: lint, types, unit tests, dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install (runtime from the hash-locked file, then dev tools)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy naco
      - run: pytest -q
      - name: Known vulnerabilities in locked dependencies
        run: pip-audit --strict --disable-pip --require-hashes -r requirements.lock
      - name: Shell scripts
        run: shellcheck quickstart.sh scripts/*.sh

  e2e:
    name: end-to-end (FreeRADIUS, RADIUS and EAP clients)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]'
      - run: pytest -m e2e tests/e2e -v
        env: { NACO_E2E_KEEP: "1" }   # leave the stack up for the logs below
      - name: Container logs
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.yml logs --no-color

  ui:
    name: admin panel in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - run: pytest -m ui tests/ui -v
      - name: Screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ui-screenshots, path: tests/ui/.shots/, if-no-files-found: ignore }

  install:
    name: quickstart on a clean host + image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: ./quickstart.sh
        run: ./quickstart.sh --host 127.0.0.1 --yes   # an IP: browsers send no SNI
      - name: The installation answers as documented
        run: |
          set -x
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt
          openssl x509 -in root.crt -noout -subject | grep -q 'CN *= *NACo Root [0-9]'   # never Caddy's shared default name
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert root.crt https://127.0.0.1/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert root.crt https://127.0.0.1/api/v1/health/ready)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/portal)" = 200
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1/)" = https://127.0.0.1/
          if curl -s -m 3 http://127.0.0.1:8081/health; then exit 1; fi   # AAA API stays internal
          docker compose exec -T naco nacoctl check-config
          docker compose exec -T naco nacoctl backup
          nc -z 127.0.0.1 49
      - name: Re-running quickstart keeps secrets and data
        run: |
          sha256sum .env > before
          ./quickstart.sh --yes
          sha256sum -c before
      - name: Scan naco image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with: { image: "naco:local", fail-build: true, severity-cutoff: high, only-fixed: true, output-format: table }
      - name: Scan naco-freeradius image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with: { image: "naco-freeradius:local", fail-build: true, severity-cutoff: high, only-fixed: true, output-format: table }
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
