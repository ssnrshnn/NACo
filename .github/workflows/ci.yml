name: CI

on:
  push:
    branches: [main, master, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:

  # ---------------------------------------------------------------------------
  # Static analysis & linting
  # ---------------------------------------------------------------------------
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .
          # Pin the linters so the gate is reproducible: a new ruff rule or
          # mypy release must be adopted deliberately, not break CI silently.
          # types-PyYAML: with requirements installed, mypy demands stubs
          # for yaml instead of falling back to ignore_missing_imports.
          pip install "ruff==0.15.20" "mypy==1.14.1" types-PyYAML
      - name: Ruff
        run: ruff check naco tests
      - name: Mypy
        # Gating (no more continue-on-error). Config lives in pyproject.toml.
        run: mypy naco

  # ---------------------------------------------------------------------------
  # Unit tests on the supported Python matrix
  # ---------------------------------------------------------------------------
  unit:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install coverage[toml]
      - name: Pytest
        env:
          NACO_CONFIG: tests/test_config.yaml
        run: |
          pytest -q --maxfail=1 --disable-warnings \
            --cov=naco --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=42 tests/
      - name: Upload coverage
        if: matrix.python == env.PYTHON_VERSION
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Integration tests — real Postgres + Redis containers, RADIUS/TACACS+ client
  # ---------------------------------------------------------------------------
  integration:
    name: integration (radclient / tac_plus)
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: naco
          POSTGRES_USER: naco
          POSTGRES_DB: naco
        options: >-
          --health-cmd "pg_isready -U naco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["6379:6379"]
    env:
      NACO_CONFIG: tests/test_config.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system packages (freeradius-utils for radclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            freeradius-utils libpcap0.8
      - name: Install NACo
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run integration suite
        run: pytest -q tests/integration -m integration --maxfail=1

  # ---------------------------------------------------------------------------
  # Docker image build (multi-arch via buildx, no push)
  # ---------------------------------------------------------------------------
  build:
    name: build container image
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: naco:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Container image vulnerability scan + SBOM
  # ---------------------------------------------------------------------------
  scan:
    name: trivy image scan + SBOM
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (amd64, load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: naco:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: naco:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: naco:scan
          format: cyclonedx
          output: naco-sbom.cdx.json
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: naco-sbom.cdx.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Dependency audit
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Helm chart: lint + template render + kind install smoke test
  # ---------------------------------------------------------------------------
  helm:
    name: helm lint + kind install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deploy/helm/naco
      - name: Template (default and all-workloads values)
        run: |
          helm template smoke deploy/helm/naco > /dev/null
          helm template smoke deploy/helm/naco \
            --set radius.enabled=true \
            --set tacacs.enabled=true \
            --set profiler.enabled=true \
            --set api.ingress.enabled=true > /dev/null
      - name: Create kind cluster
        uses: helm/kind-action@v1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for the cluster
        # Hermetic: the smoke test runs the code under review, not whatever
        # :latest happens to be on GHCR.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: naco:helm-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load image into kind
        run: kind load docker-image naco:helm-smoke --name chart-testing
      - name: Install chart (api-only, SQLite, no migration hook)
        # Smoke goal: the chart installs and the API pod becomes Ready on a
        # bare cluster. SQLite + in-memory cache avoids standing up
        # Postgres/Redis; the migration hook is skipped for the same reason.
        # Generated secrets keep the placeholder-secret startup guard happy.
        run: |
          helm install smoke deploy/helm/naco \
            --set image.repository=naco \
            --set image.tag=helm-smoke \
            --set image.pullPolicy=Never \
            --set migrations.enabled=false \
            --set radius.enabled=false \
            --set workers.enabled=false \
            --set secrets.values.NACO_DB_URL="sqlite+aiosqlite:////var/lib/naco/naco.db" \
            --set secrets.values.NACO_REDIS_URL="" \
            --set secrets.values.NACO_SESSION_SECRET="$(openssl rand -hex 32)" \
            --set secrets.values.NACO_API_SECRET="$(openssl rand -hex 32)" \
            --set secrets.values.NACO_CSRF_SECRET="$(openssl rand -hex 32)" \
            --set secrets.values.NACO_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            --wait --timeout 5m
      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -l app.kubernetes.io/instance=smoke
          kubectl logs -l app.kubernetes.io/instance=smoke --tail=100 --all-containers || true

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: |
          python -m pip install -U pip pip-audit
      - name: Audit (requirements.txt)
        # Gating: a known-vulnerable dependency fails the build. Suppress a
        # specific advisory (with justification) via --ignore-vuln GHSA-xxxx
        # if you ever need to unblock on an accepted risk.
        run: pip-audit -r requirements.txt
