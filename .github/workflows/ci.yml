name: CI

on:
  push:
    branches: [main, master, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:

  # ---------------------------------------------------------------------------
  # Static analysis & linting
  # ---------------------------------------------------------------------------
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .
          pip install ruff mypy
      - name: Ruff
        run: ruff check naco tests
      - name: Mypy
        run: mypy --ignore-missing-imports naco
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Unit tests on the supported Python matrix
  # ---------------------------------------------------------------------------
  unit:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install coverage[toml]
      - name: Pytest
        env:
          NACO_CONFIG: tests/test_config.yaml
        run: |
          pytest -q --maxfail=1 --disable-warnings \
            --cov=naco --cov-report=xml --cov-report=term-missing tests/
      - name: Upload coverage
        if: matrix.python == env.PYTHON_VERSION
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Integration tests — real Postgres + Redis containers, RADIUS/TACACS+ client
  # ---------------------------------------------------------------------------
  integration:
    name: integration (radclient / tac_plus)
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: naco
          POSTGRES_USER: naco
          POSTGRES_DB: naco
        options: >-
          --health-cmd "pg_isready -U naco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["6379:6379"]
    env:
      NACO_CONFIG: tests/test_config.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system packages (freeradius-utils for radclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            freeradius-utils libpcap0.8
      - name: Install NACo
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run integration suite
        run: pytest -q tests/integration -m integration --maxfail=1

  # ---------------------------------------------------------------------------
  # Docker image build (multi-arch via buildx, no push)
  # ---------------------------------------------------------------------------
  build:
    name: build container image
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: naco:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Dependency audit
  # ---------------------------------------------------------------------------
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: |
          python -m pip install -U pip pip-audit
      - name: Audit (requirements.txt)
        run: pip-audit -r requirements.txt --strict || true
