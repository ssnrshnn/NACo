# Tag vX.Y.Z → full CI → multi-arch images on GHCR, signed (keyless cosign),
# with SBOM and provenance → GitHub release with the CHANGELOG section.
#
#   ghcr.io/<owner>/naco:X.Y.Z, :X.Y, :latest
#   ghcr.io/<owner>/naco-freeradius:X.Y.Z, :X.Y, :latest
#
# Verify an image (cosign 3 or later):
#   cosign verify ghcr.io/<owner>/naco:X.Y.Z \
#     --certificate-identity-regexp '^https://github.com/<owner>/NACo/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: publish ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing
      attestations: write
    strategy:
      matrix:
        include:
          - { name: naco, context: ., file: deploy/Dockerfile }
          - { name: naco-freeradius, context: deploy/freeradius, file: deploy/freeradius/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Tag matches the package version
        if: matrix.name == 'naco'
        run: |
          version="$(grep -m1 -E '^__version__' naco/__init__.py | cut -d'"' -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "naco/__init__.py says $version"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (on) exit; on = index($0, v) > 0; next } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "NACo $GITHUB_REF_NAME" --notes-file notes.md
