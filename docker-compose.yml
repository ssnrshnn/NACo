# NACo — three containers, one file.
#
#   caddy       80/tcp, 443/tcp   admin panel + API (HTTPS), guest portal (HTTP)
#   freeradius  1812/udp, 1813/udp RADIUS for switches and access points
#   naco        49/tcp            TACACS+ (the AAA API and UI stay internal)
#
# Start with ./quickstart.sh, which writes .env and the EAP certificates.
#
# Ports are published on IPv4 only: Docker would carry IPv6 connections to
# these IPv4 containers through a proxy that replaces the client's address,
# and NACo identifies switches, guests and sign-in sources by address.
name: naco

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  naco:
    <<: *hardening
    image: ${NACO_IMAGE:-naco:local}
    build: { context: ., dockerfile: deploy/Dockerfile }
    environment:
      NACO_MASTER_KEY: ${NACO_MASTER_KEY:?run ./quickstart.sh first}
      NACO_INTERNAL_TOKEN: ${NACO_INTERNAL_TOKEN:?run ./quickstart.sh first}
      NACO_ADMIN_PASSWORD: ${NACO_ADMIN_PASSWORD:-}
      NACO_LDAP_BIND_PASSWORD: ${NACO_LDAP_BIND_PASSWORD:-}
      # Only Caddy may set X-Forwarded-For.
      NACO_TRUSTED_PROXIES: ${NACO_IP_CADDY:-172.30.0.10}
      TZ: ${TZ:-UTC}
    volumes:
      - naco_data:/var/lib/naco
      - ./config:/etc/naco:ro
      - naco_backups:/backups
    tmpfs: ["/tmp"]
    ports:
      - "0.0.0.0:49:4949/tcp"
    networks:
      naco: { ipv4_address: "${NACO_IP_APP:-172.30.0.12}" }

  freeradius:
    <<: *hardening
    image: ${NACO_RADIUS_IMAGE:-naco-freeradius:local}
    build: { context: deploy/freeradius }
    environment:
      NACO_AAA_URL: http://naco:8081
      NACO_INTERNAL_TOKEN: ${NACO_INTERNAL_TOKEN:?run ./quickstart.sh first}
    volumes:
      - ./deploy/freeradius/certs:/etc/raddb/certs:ro
    tmpfs: ["/opt/var/run/radiusd:uid=1812,gid=1812", "/tmp"]
    ports:
      - "0.0.0.0:1812:1812/udp"
      - "0.0.0.0:1813:1813/udp"
    depends_on:
      naco: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pgrep", "radiusd"]
      interval: 30s
      timeout: 5s
    networks:
      naco: { ipv4_address: "${NACO_IP_RADIUS:-172.30.0.11}" }

  caddy:
    <<: *hardening
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    cap_add: [NET_BIND_SERVICE]
    environment:
      NACO_HOST: ${NACO_HOST:?run ./quickstart.sh first}
      NACO_TLS: ${NACO_TLS:-internal}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp"]
    ports:
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:443:443/tcp"
    depends_on:
      naco: { condition: service_healthy }
    networks:
      naco: { ipv4_address: "${NACO_IP_CADDY:-172.30.0.10}" }

networks:
  naco:
    ipam:
      config: [{ subnet: "${NACO_SUBNET:-172.30.0.0/24}" }]

volumes:
  naco_data:
  naco_backups:
  caddy_data:
  caddy_config:
