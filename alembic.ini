# Alembic configuration for NACo
# Run migrations with: alembic upgrade head

[alembic]
script_location = alembic
# Resolved at runtime from naco.config / NACO_DB_URL. This placeholder is only
# used when running `alembic` outside the application's import context.
sqlalchemy.url = postgresql://naco:naco@postgres:5432/naco

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
