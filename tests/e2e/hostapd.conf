# A wired 802.1X authenticator with its Disconnect server (RFC 5176) — the
# hostapd inside OpenWrt and many access points. Strict, as a NAS should be:
# Disconnect-Requests only from NACo, with Event-Timestamp and
# Message-Authenticator, and identified only by attributes it knows.
interface=ap0
driver=wired
logger_stdout=-1
logger_stdout_level=1
ieee8021x=1
eap_reauth_period=0
use_pae_group_addr=1
own_ip_addr=172.31.250.30
nas_identifier=e2e-ap
auth_server_addr=172.31.250.11
auth_server_port=1812
auth_server_shared_secret=e2e-nas-shared-secret
acct_server_addr=172.31.250.11
acct_server_port=1813
acct_server_shared_secret=e2e-nas-shared-secret
radius_das_port=3799
radius_das_client=172.31.250.12 e2e-nas-shared-secret
radius_das_require_event_timestamp=1
radius_das_require_message_authenticator=1
