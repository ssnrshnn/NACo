[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naco"
dynamic = ["version"]
description = "NACo — a small, secure, single-host Network Access Control & AAA server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["radius", "tacacs+", "nac", "aaa", "802.1x", "network-access-control", "captive-portal", "freeradius"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
# Version policy: a lower bound pins the minimum tested release, an upper bound
# keeps an unattended rebuild from pulling a new major. Security-critical
# libraries (cryptography) take patches without an upper bound. Production
# images install from the hash-locked requirements.lock.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "jinja2>=3.1.4,<4.0",
    "python-multipart>=0.0.18,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0.2,<7.0",
    "click>=8.1.7,<9.0",
    "bcrypt>=4.2,<6.0",
    "cryptography>=44",
    "pyotp>=2.9,<3.0",
    "ldap3>=2.9.1,<3.0",
    "qrcode>=8.0,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/ssnrshnn/NACo"
Issues   = "https://github.com/ssnrshnn/NACo/issues"

[project.scripts]
naco    = "naco.main:main"
nacoctl = "naco.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "naco.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["naco*"]

[tool.setuptools.package-data]
naco = [
    "data/*",
    "db/migrations/*.py",
    "db/migrations/*.mako",
    "db/migrations/versions/*.py",
    "web/templates/**/*",
    "web/static/**/*",
    "portal/templates/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: needs Docker (real FreeRADIUS); run with `pytest -m e2e`",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RUF", "SIM"]
# S101: asserts are fine in tests and for type narrowing.
# S104: binding 0.0.0.0 is intentional inside the container.
# S324: MD5 is mandated by the RADIUS/TACACS+ wire formats, never used for passwords.
ignore = ["E501", "S101", "S104", "S324"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"naco/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["naco/db/migrations/"]
