[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naco"
version = "2.0.0"
description = "NACo — a modern, container-native Network Access Control & AAA server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["radius", "tacacs+", "nac", "aaa", "network-access-control", "captive-portal", "coa", "freeradius"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]

[project.urls]
Homepage      = "https://github.com/your-org/naco"
Documentation = "https://github.com/your-org/naco#readme"
Issues        = "https://github.com/your-org/naco/issues"

[project.scripts]
naco    = "naco.main:main"
nacoctl = "naco.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "aiosqlite>=0.19",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["naco*"]

[tool.setuptools.package-data]
naco = [
    "config/config.yaml",
    "radius/dictionary",
    "web/templates/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "portal/templates/*.html",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: marks tests requiring external binaries / services (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RUF"]
ignore = ["E501", "S101", "S104", "S105", "S106", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"alembic/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
