[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naco"
version = "2.2.0"
description = "NACo — a modern, container-native Network Access Control & AAA server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["radius", "tacacs+", "nac", "aaa", "network-access-control", "captive-portal", "coa", "freeradius"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]

[project.urls]
Homepage      = "https://github.com/ssnrshnn/naco"
Documentation = "https://github.com/ssnrshnn/naco#readme"
Issues        = "https://github.com/ssnrshnn/naco/issues"

[project.scripts]
naco    = "naco.main:main"
nacoctl = "naco.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "aiosqlite>=0.19",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["naco*"]

[tool.setuptools.package-data]
naco = [
    "radius/dictionary",
    "web/templates/*.html",
    "web/static/css/*.css",
    "web/static/img/*.png",
    "portal/templates/*.html",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: marks tests requiring external binaries / services (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RUF", "E712"]
# Pragmatic ignores for AAA / network codebases:
#   RUF002/RUF003 — EN-dash and similar in docstrings/comments (technical prose).
#   E701/E702     — one-line compound statements in crypto / packet helpers.
#   S110          — intentional ``except Exception: pass`` (best-effort paths).
#   E402          — late imports (optional deps, circular import avoidance).
#   S324          — MD5/SHA1 used by RADIUS/TACACS wire formats, not TLS.
#   S310          — ``urllib.request`` patterns audited elsewhere.
#   B904          — ``raise HTTPException`` from handlers without chaining.
#   RUF012        — SQLAlchemy declarative patterns with mutable defaults.
ignore = [
    "E501", "S101", "S104", "S105", "S106", "S603", "S607", "B008",
    "RUF002", "RUF003", "E701", "E702", "S110", "E402", "S324", "S310", "B904", "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"alembic/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
# `warn_unused_ignores` is intentionally off: the exact set of required
# `# type: ignore` comments varies between mypy releases, and a hard CI gate
# must not break just because a runner pulled a slightly different mypy.
warn_unused_ignores = false
warn_return_any = false
ignore_missing_imports = true
