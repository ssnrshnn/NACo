global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: naco

scrape_configs:
  - job_name: naco
    metrics_path: /api/v1/metrics
    scheme: http
    static_configs:
      # Prometheus shares the host network namespace with NACo, so the
      # metrics endpoint is reachable on loopback.
      - targets:
          - "127.0.0.1:8080"
        labels:
          app: naco

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
