global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: naco

scrape_configs:
  - job_name: naco
    metrics_path: /api/v1/metrics
    scheme: http
    static_configs:
      - targets:
          - "host.docker.internal:8080"
        labels:
          app: naco

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
