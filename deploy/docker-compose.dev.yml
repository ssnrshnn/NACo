# Local development override:
#   * builds the `Dockerfile.dev` image
#   * mounts the source tree for hot reload
#   * exposes naco on host:8080 (no host networking — RADIUS won't work
#     transparently in dev; this is fine for UI / API hacking).
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up

name: naco

services:
  naco:
    image: naco-dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    network_mode: bridge
    networks: [naco_net]
    ports:
      - "8080:8080"
    volumes:
      - ../naco:/app/naco
      - ../alembic:/app/alembic
      - ../tests:/app/tests
      - ../config:/etc/naco
    environment:
      NACO_DB_URL: postgresql+asyncpg://${NACO_DB_USER:-naco}:${NACO_DB_PASSWORD:-naco}@postgres:5432/${NACO_DB_NAME:-naco}
      NACO_REDIS_URL: redis://redis:6379/0
    cap_add: []
    command: ["uvicorn", "naco.app:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  caddy:
    profiles: ["disabled"]
