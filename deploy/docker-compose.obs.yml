# Optional observability stack: Prometheus + Grafana + Loki + Promtail.
#
#     docker compose -f docker-compose.yml -f docker-compose.obs.yml \
#                    --profile obs up -d

name: naco

services:
  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    profiles: ["obs"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [naco_net]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    profiles: ["obs"]
    depends_on:
      prometheus: { condition: service_started }
      loki:       { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [naco_net]

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    networks: [naco_net]

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    profiles: ["obs"]
    depends_on:
      loki: { condition: service_started }
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
    networks: [naco_net]

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
