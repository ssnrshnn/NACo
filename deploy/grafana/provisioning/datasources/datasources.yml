apiVersion: 1

datasources:
  # Grafana runs in the host network namespace (see docker-compose.yml), so
  # it reaches Prometheus and Loki over loopback rather than by service name.
  - name: Prometheus
    uid: naco-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: naco-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: false
