# NACo's FreeRADIUS sidecar — NAS clients.
#
# Operators add each switch / AP / VPN endpoint that may talk RADIUS to this
# stack. The shared secret MUST be at least 16 characters and SHOULD be
# unique per NAS.

client default-network {
    ipaddr  = 0.0.0.0/0
    secret  = ${NACO_FREERADIUS_SHARED_SECRET}
    require_message_authenticator = yes  # BlastRADIUS mitigation
    nas_type = other
}
