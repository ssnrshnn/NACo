# No static NAS list: when a packet arrives from an unknown address,
# FreeRADIUS asks NACo (sites-enabled/dynamic-clients) and caches the answer
# for 60 seconds. Unknown or disabled NAS → the packet is silently dropped.
client nas {
	ipaddr = 0.0.0.0/0
	dynamic_clients = dynamic_clients
	lifetime = 60
}
