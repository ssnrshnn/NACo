# Optional FreeRADIUS sidecar for EAP-PEAP / EAP-TLS / EAP-TTLS.
#
#     docker compose -f docker-compose.yml -f docker-compose.eap.yml \
#                    --profile eap up -d

name: naco

services:
  freeradius:
    image: freeradius/freeradius-server:3.2-alpine
    restart: unless-stopped
    network_mode: host
    profiles: ["eap"]
    depends_on:
      naco: { condition: service_healthy }
    environment:
      NACO_EAP_TOKEN:   ${NACO_EAP_BEARER_TOKEN:?NACO_EAP_BEARER_TOKEN is required when --profile eap is active}
      NACO_EAP_URL:     http://127.0.0.1:8080/api/v1/eap
    volumes:
      - ./freeradius/raddb:/etc/raddb:ro
      - ./freeradius/certs:/etc/raddb/certs:rw
    healthcheck:
      test: ["CMD-SHELL", "radclient -t 2 -r 1 127.0.0.1:1812 status testing123 >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
