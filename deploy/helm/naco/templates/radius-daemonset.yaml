{{- if .Values.radius.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "naco.fullname" . }}-radius
  labels:
    {{- include "naco.labels" . | nindent 4 }}
    app.kubernetes.io/component: radius
spec:
  selector:
    matchLabels:
      {{- include "naco.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: radius
  template:
    metadata:
      labels:
        {{- include "naco.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: radius
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "naco.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # hostNetwork so NAS devices reach RADIUS on the node IP and NACo sees
      # the real client source address; ClusterFirstWithHostNet keeps cluster
      # DNS working for Postgres/Redis service names.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: radius
          image: {{ include "naco.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: NACO_ROLES
              value: "radius"
            - name: NACO_PORT
              value: {{ .Values.radius.httpPort | quote }}
            {{- include "naco.commonEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.radius.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: radius-auth
              containerPort: {{ .Values.config.radius.auth_port }}
              hostPort: {{ .Values.config.radius.auth_port }}
              protocol: UDP
            - name: radius-acct
              containerPort: {{ .Values.config.radius.acct_port }}
              hostPort: {{ .Values.config.radius.acct_port }}
              protocol: UDP
            - name: radius-coa
              containerPort: {{ .Values.config.radius.coa_port }}
              hostPort: {{ .Values.config.radius.coa_port }}
              protocol: UDP
            - name: http
              containerPort: {{ .Values.radius.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.radius.resources | nindent 12 }}
          volumeMounts:
            {{- include "naco.configVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "naco.configVolume" . | nindent 8 }}
      {{- with .Values.radius.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.radius.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.radius.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
