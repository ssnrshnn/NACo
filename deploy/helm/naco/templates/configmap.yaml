apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "naco.configMapName" . }}
  labels:
    {{- include "naco.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Rendered by the NACo Helm chart. Per-role behaviour is selected with the
    # NACO_ROLES env var on each workload, not here. Secrets are injected via
    # env (see the Secret), never written into this file.
    #
    # The radius/tacacs/profiler *feature* flags are derived from whether their
    # workload is enabled — the role gate then ensures only the matching pods
    # actually start each subsystem, so this ConfigMap can be shared safely.
    {{- $cfg := deepCopy .Values.config -}}
    {{- $_ := set (index $cfg "radius") "enabled" .Values.radius.enabled -}}
    {{- $_ := set (index $cfg "tacacs") "enabled" .Values.tacacs.enabled -}}
    {{- $_ := set (index $cfg "profiler") "enabled" .Values.profiler.enabled -}}
    {{- toYaml $cfg | nindent 4 }}
