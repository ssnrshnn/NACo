apiVersion: v2
name: naco
description: |
  NACo — open-source Network Access Control (NAC/AAA). This chart splits NACo
  into horizontally-scalable roles: a stateless API/UI/portal Deployment, a
  singleton workers Deployment for maintenance loops, and host-networked
  RADIUS / TACACS+ / profiler DaemonSets so network devices see real NAS
  source IPs.
type: application
# Chart version — bump on chart changes.
version: 0.1.0
# The NACo application version this chart deploys by default.
appVersion: "2.2.0"
home: https://github.com/ssnrshnn/naco
sources:
  - https://github.com/ssnrshnn/naco
keywords:
  - nac
  - radius
  - tacacs
  - aaa
  - 802.1x
  - network-access-control
maintainers:
  - name: NACo maintainers
    url: https://github.com/ssnrshnn/naco
